<!doctype html>
<!--
  Browser harness for QEMU WebAssembly smoke tests.

  SPDX-License-Identifier: GPL-2.0-or-later
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QEMU WebAssembly smoke test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      #status {
        font-weight: 600;
      }
      #output {
        background: #111;
        color: #eee;
        min-height: 24rem;
        overflow: auto;
        padding: 1rem;
        white-space: pre-wrap;
      }
      #canvas {
        background: #000;
        border: 1px solid #444;
        display: block;
        height: auto;
        image-rendering: pixelated;
        margin: 1rem 0;
        max-width: 100%;
        outline: 2px solid transparent;
      }
      #canvas:focus {
        outline-color: #3677ff;
      }
      #canvas[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>QEMU WebAssembly smoke test</h1>
    <p id="status">initializing</p>
    <canvas id="canvas" data-qemu-display="true" width="640" height="480" tabindex="0" hidden aria-label="QEMU graphical display"></canvas>
    <pre id="output" aria-live="polite"></pre>
    <script type="module" src="./wasm-browser-smoke.mjs"></script>
  </body>
</html>
